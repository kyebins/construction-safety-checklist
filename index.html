<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>건설 현장 안전 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Malgun Gothic",sans-serif; background:#e8efe9; color:#1c241f; }
    header { background:linear-gradient(160deg,#123c2c,#1d5a42); color:#fff; padding:36px 16px 48px; }
    .wrap { max-width:760px; margin:0 auto; }
    .tag { display:inline-block; background:#f0b429; color:#1c241f; font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:4px; }
    h1 { margin:12px 0 8px; font-size:1.6rem; }
    header p { margin:0; opacity:.92; line-height:1.5; }
    main { max-width:760px; margin:-28px auto 0; padding:0 12px 40px; }
    a.card { display:block; background:#fff; border-radius:12px; padding:18px; margin-bottom:12px; text-decoration:none; color:inherit; box-shadow:0 2px 10px rgba(18,60,44,.08); }
    a.card:hover { outline:2px solid #1b5c43; }
    a.card h2 { margin:0 0 6px; color:#123c2c; font-size:1.1rem; }
    a.card p { margin:0; color:#4a5c54; font-size:.9rem; }
    .go { margin-top:10px; color:#1b7a4e; font-weight:700; font-size:.9rem; }
    footer { max-width:760px; margin:0 auto; padding:0 12px 28px; color:#4a5c54; font-size:.82rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <span class="tag">현장 안전 관리</span>
      <h1>건설 현장 안전 홈</h1>
      <p>작업 전 점검을 시작하고, 현장 안전 기준을 확인하세요.</p>
    </div>
  </header>
  <main>
    <a class="card" href="checklist.html">
      <h2>안전 체크리스트</h2>
      <p>개인 보호구, 작업 전 점검, 현장 환경, 고소·굴착 항목을 확인합니다.</p>
      <div class="go">점검 시작 →</div>
    </a>
    <div class="card" style="background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(18,60,44,.08);">
      <h2 style="margin:0 0 6px;font-size:1.1rem;">안내</h2>
      <p style="margin:0;color:#4a5c54;font-size:.9rem;">미완료 항목이 있으면 작업을 시작하지 마세요. 긴급 상황 시 119에 연락하세요.</p>
    </div>
  </main>
  <footer>건설 현장 안전 점검용 간단 페이지</footer>
</body>
</html>
