<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>건설 현장 안전 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Malgun Gothic",sans-serif; background:#e8efe9; color:#1c241f; }
    header { background:linear-gradient(160deg,#123c2c,#1d5a42); color:#fff; padding:36px 16px 48px; }
    .wrap { max-width:760px; margin:0 auto; }
    .tag { display:inline-block; background:#f0b429; color:#1c241f; font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:4px; }
    h1 { margin:12px 0 8px; font-size:1.6rem; }
    header p { margin:0; opacity:.92; line-height:1.5; }
    main { max-width:760px; margin:-28px auto 0; padding:0 12px 40px; }
    a.card { display:block; background:#fff; border-radius:12px; padding:18px; margin-bottom:12px; text-decoration:none; color:inherit; box-shadow:0 2px 10px rgba(18,60,44,.08); }
    a.card:hover { outline:2px solid #1b5c43; }
    a.card h2 { margin:0 0 6px; color:#123c2c; font-size:1.1rem; }
    a.card p { margin:0; color:#4a5c54; font-size:.9rem; }
    .go { margin-top:10px; color:#1b7a4e; font-weight:700; font-size:.9rem; }
    .log { background:#fff; border-radius:12px; padding:18px; margin-bottom:12px; box-shadow:0 2px 10px rgba(18,60,44,.08); }
    .log h2 { margin:0 0 10px; font-size:1.1rem; }
    .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .nav button { border:1px solid #dce7e1; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
    .week { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:.75rem; color:#4a5c54; margin-bottom:4px; }
    .days { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .days button { border:1px solid #eef3f0; background:#f7faf8; border-radius:8px; min-height:42px; cursor:pointer; font:inherit; }
    .days button.has { background:#e8f6ee; font-weight:700; }
    .days button.on { outline:2px solid #1b5c43; }
    .days button.muted { opacity:.35; }
    textarea { width:100%; min-height:72px; margin-top:10px; border:1px solid #dce7e1; border-radius:8px; padding:8px; font:inherit; }
    .save { margin-top:8px; background:#123c2c; color:#fff; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; }
    footer { max-width:760px; margin:0 auto; padding:0 12px 28px; color:#4a5c54; font-size:.82rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <span class="tag">현장 안전 관리</span>
      <h1>건설 현장 안전 홈</h1>
      <p>작업 전 점검을 시작하고, 현장 안전 기준을 확인하세요.</p>
    </div>
  </header>
  <main>
    <a class="card" href="checklist.html">
      <h2>안전 체크리스트</h2>
      <p>개인 보호구, 작업 전 점검, 현장 환경, 고소·굴착 항목을 확인합니다.</p>
      <div class="go">점검 시작 →</div>
    </a>
    <div class="log">
      <h2>작업기록</h2>
      <div class="nav">
        <button type="button" id="prev">이전</button>
        <strong id="ym"></strong>
        <button type="button" id="next">다음</button>
      </div>
      <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="days" id="days"></div>
      <p id="picked" style="margin:10px 0 0;font-size:.9rem;color:#4a5c54;"></p>
      <textarea id="note" placeholder="선택한 날짜의 작업 내용을 입력하세요."></textarea>
      <button type="button" class="save" id="save">기록 저장</button>
    </div>
    <div class="card" style="background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(18,60,44,.08);">
      <h2 style="margin:0 0 6px;font-size:1.1rem;">안내</h2>
      <p style="margin:0;color:#4a5c54;font-size:.9rem;">미완료 항목이 있으면 작업을 시작하지 마세요. 긴급 상황 시 119에 연락하세요.</p>
    </div>
  </main>
  <footer>건설 현장 안전 점검용 간단 페이지</footer>
  <script>
    const key = "site-work-logs";
    const logs = JSON.parse(localStorage.getItem(key) || "{}");
    let y, m, sel;
    const now = new Date();
    y = now.getFullYear(); m = now.getMonth();
    function iso(yy, mm, d) { return yy + "-" + String(mm + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0"); }
    function draw() {
      document.getElementById("ym").textContent = y + "년 " + (m + 1) + "월";
      const first = new Date(y, m, 1).getDay();
      const last = new Date(y, m + 1, 0).getDate();
      const box = document.getElementById("days");
      box.innerHTML = "";
      for (let i = 0; i < first; i++) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "muted"; b.disabled = true;
        box.appendChild(b);
      }
      for (let d = 1; d <= last; d++) {
        const id = iso(y, m, d);
        const b = document.createElement("button");
        b.type = "button"; b.textContent = d;
        if (logs[id]) b.classList.add("has");
        if (sel === id) b.classList.add("on");
        b.onclick = () => pick(id);
        box.appendChild(b);
      }
    }
    function pick(id) {
      sel = id;
      document.getElementById("picked").textContent = id + " 작업기록";
      document.getElementById("note").value = logs[id] || "";
      draw();
    }
    document.getElementById("prev").onclick = () => { m--; if (m < 0) { m = 11; y--; } draw(); };
    document.getElementById("next").onclick = () => { m++; if (m > 11) { m = 0; y++; } draw(); };
    document.getElementById("save").onclick = () => {
      if (!sel) return;
      const t = document.getElementById("note").value.trim();
      if (t) logs[sel] = t; else delete logs[sel];
      localStorage.setItem(key, JSON.stringify(logs));
      draw();
    };
    pick(iso(now.getFullYear(), now.getMonth(), now.getDate()));
  </script>
</body>
</html>
